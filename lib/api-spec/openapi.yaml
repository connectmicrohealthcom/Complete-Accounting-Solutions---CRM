        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, receptionist, stylist, therapist]
        specialization:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        commissionRate:
          type: ["number", "null"]
        targetMonthly:
          type: ["number", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    StaffInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, manager, receptionist, stylist, therapist]
        specialization:
          type: string
        color:
          type: string
        commissionRate:
          type: number
        targetMonthly:
          type: number

    StaffUpdate:
