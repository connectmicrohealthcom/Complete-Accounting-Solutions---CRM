name: Stage 0 CI Validation

on:
  pull_request:
    branches: [main]

jobs:
  production-reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API health
        run: curl --fail --show-error --silent --max-time 30 https://complete-accounting-solutions-crm.onrender.com/api/healthz
      - name: Check Vercel frontend
        run: curl --fail --show-error --silent --max-time 30 -I https://personal-crm-cas.vercel.app

  build-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cas_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Database schema push
        run: pnpm --filter @workspace/db push
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server build
      - name: Start API for smoke test
        run: |
          PORT=5001 NODE_ENV=test SESSION_SECRET=stage0-ci-session pnpm --filter @workspace/api-server start > /tmp/cas-api.log 2>&1 &
          echo $! > /tmp/cas-api.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5001/api/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cas-api.log
          exit 1
      - name: API smoke test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5001
          SMOKE_EMAIL: stage0-admin@completeaccounting.test
          SMOKE_PASSWORD: stage0-ci-password
          NODE_ENV: test
          SESSION_SECRET: stage0-ci-session
          PORT: 5001
        run: pnpm --filter @workspace/scripts stage0-smoke
      - name: Stop API
        if: always()
        run: if [ -f /tmp/cas-api.pid ]; then kill $(cat /tmp/cas-api.pid) || true; fi
      - name: Build frontend
        run: pnpm --filter @workspace/salon-crm build
