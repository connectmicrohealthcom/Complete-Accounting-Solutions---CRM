kind = "web"
previewPath = "/"
title = "Layal Al Zahra Salon CRM"
version = "1.0.0"
id = "artifacts/salon-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23395

[services.development]
run = "pnpm --filter @workspace/salon-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salon-crm", "run", "build" ]
publicDir = "artifacts/salon-crm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23395"
BASE_PATH = "/"
